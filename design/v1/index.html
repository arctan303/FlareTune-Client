<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FlareTune · v1</title>
<style>
/* ============================================================
   数值来源标记：
   [APK] = Spotify 9.2.0 APK 布局反编译直读（见 ../README.md 对照表）
   [SHOT] = 截图逐像素测量
   [AM]  = Apple Music 7.0.0 资源表
   ============================================================ */
:root{
  --bg:#121212;                  /* [SHOT] 页面底色 */
  --surface:#1f1f1f;             /* [SHOT] 底栏 */
  --surface-2:#333333;           /* [SHOT] chip 未选中 */
  --surface-3:#2a2a2a;
  --line:rgba(255,255,255,.10);
  --t1:#ffffff;
  --t2:#b3b3b3;
  --t3:#7a7a7a;
  --accent:#ff7a45;              /* FlareTune 品牌暖橙 */
  --accent-ink:#1a0d06;

  /* --- 从 APK 直读的结构常量 --- */
  --h-mini:56px;                 /* [APK] floating_now_playing_bar_height */
  --r-mini:8px;                  /* [APK] floating_now_playing_bar_corner_radius */
  --pad-mini:8px;                /* [APK] floating_now_playing_bar_content_padding */
  --pad-mini-lg:16px;            /* [APK] floating_now_playing_bar_large_content_padding */
  --btn-mini:40px;               /* [APK] now_playing_bar_actions_button_size */
  --h-tab:48px;                  /* [APK] tab_bar_size */
  --pad-page:16px;               /* [APK] row_horizontal_padding */
  --gap-sec-top:40px;            /* [APK] glue_sectionheader_large marginTop */
  --gap-sec-bottom:16px;         /* [APK] glue_sectionheader_large marginBottom */
  --gap-row-top:16px;            /* [APK] carousel_row paddingTop (spacer_16) */
  --gap-row-bottom:40px;         /* [APK] carousel_row paddingBottom (spacer_40) */
  --fade-chip:12px;              /* [APK] funkis_filter_chips_header 渐隐宽度 */
  --dur-expand:100ms;            /* [APK] now_playing_bar_scene duration */

  --cols:2;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-feature-settings:"tnum" 1,"lnum" 1;   /* 数字等宽，进度不跳字 */
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}

/* ============ 顶栏 chips ============ */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:8px;
  padding:10px var(--pad-page);
  background:linear-gradient(180deg,var(--bg) 62%,rgba(18,18,18,0));
}
.chip-icon{
  flex:0 0 40px;height:40px;border-radius:999px;
  display:grid;place-items:center;
  background:var(--surface-2);
}
.chip-icon svg{stroke:#5ad36a;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chips{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding-right:var(--fade-chip);
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - var(--fade-chip)),transparent 100%);
          mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - var(--fade-chip)),transparent 100%);
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;height:40px;padding:0 16px;border-radius:999px;
  background:var(--surface-2);color:var(--t1);
  font-size:14px;font-weight:500;white-space:nowrap;
  transition:background var(--dur-expand) ease,color var(--dur-expand) ease;
}
.chip.is-active{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* ============ 内容区 ============ */
.page{
  padding:0 0 calc(var(--h-mini) + var(--h-tab) + 40px);
  max-width:1400px;margin:0 auto;
}
.quick{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  padding:8px var(--pad-page) 0;
}

.quick-card{
  display:flex;align-items:center;gap:12px;
  height:64px;border-radius:6px;overflow:hidden;
  background:var(--surface-3);
  text-align:left;
}
.quick-card .qc-art{
  flex:0 0 64px;height:64px;
  display:grid;place-items:center;
  font-size:26px;
}
.quick-card .qc-t{
  font-size:13px;font-weight:600;padding-right:10px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.sec-title{
  margin:32px 0 var(--gap-sec-bottom);
  padding:0 var(--pad-page);
  font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2;
}

.row{
  display:grid;
  grid-auto-flow:column;
  grid-auto-columns:44%;
  gap:12px;
  padding:var(--gap-row-top) var(--pad-page) 8px;
  overflow-x:auto;scroll-snap-type:x proximity;
  scroll-padding-inline:var(--pad-page);
  scrollbar-width:none;
}
.row::-webkit-scrollbar{display:none}
@media(min-width:640px){.row{grid-auto-columns:31%}}
@media(min-width:900px){.row{grid-auto-columns:22%}}
@media(min-width:1200px){.row{grid-auto-columns:18%}}

.card{scroll-snap-align:start;text-align:left;min-width:0}
.card .art{
  position:relative;aspect-ratio:1/1;border-radius:4px;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
}
.card .art .glyph{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:clamp(20px,7vw,40px);font-weight:800;letter-spacing:.08em;
  color:rgba(255,255,255,.92);text-shadow:0 2px 12px rgba(0,0,0,.35);
  padding:10%;
  text-align:center;line-height:1.1;
}
.card .kind{                     /* [APK] glue_card 上方标签行 */
  margin-top:12px;font-size:12px;color:var(--t2);
}
.card .title{                    /* [APK] marginTop 20 → 这里取 4（标签行已占位） */
  margin-top:4px;font-size:14px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card .artist{margin-top:4px;font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 列表行 */
.list{padding:0 var(--pad-page) 0}
.lrow{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:8px 0;text-align:left;
}
.lrow .lart{flex:0 0 48px;height:48px;border-radius:4px;overflow:hidden}  /* [APK] track_row_cover_art_size */
.lrow .lt{flex:1;min-width:0}
.lrow .lt b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lt span{display:block;margin-top:2px;font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lmore{color:var(--t3);padding:0 4px}

/* ============ 底部 dock：tabbar + mini ============ */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;flex-direction:column;gap:8px;
  padding:0 8px calc(8px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.dock .mini{order:1}
.dock .tabbar{order:2}
/* 底部安全区遮罩：避免滚动内容从 dock 下方缝隙露出 */
.dock::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:12px;
  background:var(--bg);pointer-events:none;
}
.dock > *{pointer-events:auto}

.tabbar{
  height:var(--h-tab);border-radius:var(--r-mini);
  background:var(--surface);
  display:flex;align-items:center;justify-content:space-around;
  padding:0 4px;
}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--t2);font-size:10px;line-height:1;padding:0 10px;height:40px;border-radius:6px;
  white-space:nowrap;transition:color var(--dur-expand) ease;
}
.tab svg{display:block;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.is-active{color:var(--t1)}

/* mini player —— 尺寸全部来自 now_playing_bar.xml */
.mini{
  position:relative;
  /* 空态：高度 0，内容不可见 */
  height:0;padding:0;opacity:0;
  transform:scaleY(0);
  transform-origin:50% 100%;          /* pivotY=100%：从底边长出来 */
  border-radius:var(--r-mini);
  background:var(--mini-bg,#2a2a2a);
  display:flex;align-items:center;
  overflow:hidden;
  text-align:left;
  transition:
    height var(--dur-expand) cubic-bezier(.34,1.56,.64,1),
    padding var(--dur-expand) cubic-bezier(.34,1.56,.64,1),
    transform var(--dur-expand) cubic-bezier(.34,1.56,.64,1),
    opacity var(--dur-expand) linear,
    background var(--dur-expand) linear;
}
/* 有曲目：展开（进入用 overshoot） */
.mini.has-track{
  height:var(--h-mini);
  padding:var(--pad-mini);
  opacity:1;
  transform:scaleY(1);
}
/* 退出：anticipate（先反向蓄力再抽走） */
.mini.is-leaving{
  height:0;padding:0;opacity:0;transform:scaleY(0);
  transition-timing-function:cubic-bezier(.36,0,.66,-.56);
}
.mini .m-art{
  flex:0 0 calc(var(--h-mini) - var(--pad-mini)*2);  /* 56-16=40，1:1 */
  height:100%;border-radius:2px;overflow:hidden;
}
.mini .m-meta{
  flex:1;min-width:0;margin-left:12px;               /* [APK] now_playing_bar_carousel_margin */
}
.mini .m-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .m-sub{
  margin-top:2px;font-size:12px;color:var(--t2);
  display:flex;align-items:center;gap:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mini .m-sub .dot{color:var(--t3)}
.mini .m-actions{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.mini .mbtn{
  width:var(--btn-mini);height:var(--btn-mini);border-radius:999px;
  display:grid;place-items:center;color:var(--t1);
}
.mini .mbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mini .mbtn.play svg{fill:currentColor;stroke:none;width:20px;height:20px}
.mini .m-prog{
  position:absolute;left:var(--pad-mini);right:var(--pad-mini);bottom:0;height:2px;
  background:rgba(255,255,255,.18);
  transition:left var(--dur-expand) ease,right var(--dur-expand) ease;
}
.mini .m-prog i{display:block;height:100%;width:0;background:var(--t1)}

@media(min-width:720px){
  .dock{flex-direction:row;align-items:center;justify-content:center;gap:12px;padding:12px 16px}
  .dock::after{height:16px}
  .dock .tabbar{flex:0 1 560px;order:1}
  .dock .mini{flex:0 0 360px;order:2}
  .page{padding-bottom:calc(var(--h-mini) + 32px)}
}

/* ============ 全屏播放页（Apple Music 秩序） ============ */
.full{
  position:fixed;inset:0;z-index:60;
  background:#0b0b0b;
  display:flex;flex-direction:column;
  transform:translateY(100%);
  /* 退出 200ms，进 150ms —— 与 nowplaying_activity_enter/exit 一致 */
  transition:transform 200ms cubic-bezier(.34,1.56,.64,1);
  will-change:transform;
}
.full.is-open{
  transform:translateY(0);
  transition-duration:150ms;
}
.full .wash{
  position:absolute;inset:0;
  background:var(--wash,radial-gradient(120% 90% at 30% 10%,#3a2a55 0%,#0b0b0b 62%));
  transition:background .45s ease;
}
.full .scrim{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.55) 55%,rgba(0,0,0,.86) 100%);
}
.full > *{position:relative}

.fp-head{
  display:flex;align-items:center;gap:8px;
  padding:calc(14px + env(safe-area-inset-top)) var(--pad-page) 6px;
  flex:0 0 auto;
}
.fp-head .hbtn{
  width:40px;height:40px;border-radius:999px;display:grid;place-items:center;
}
.fp-head .hbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fp-head .hlabel{flex:1;text-align:center;font-size:12px;letter-spacing:.02em;color:rgba(255,255,255,.62)}

.fp-body{
  flex:1;min-height:0;display:flex;flex-direction:column;
  padding:0 var(--pad-page);
}
.fp-art{
  flex:0 0 auto;margin:8px auto 0;
  width:min(88vw,380px);aspect-ratio:1/1;   /* [AM] 大封面，居中 */
  border-radius:8px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.55);
  transition:opacity .2s ease;
}
.fp-meta{margin-top:20px;flex:0 0 auto}
.fp-meta h1{
  margin:0;font-size:22px;font-weight:700;line-height:1.25;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.fp-meta p{margin:6px 0 0;font-size:15px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fp-teaser{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;
  gap:10px;padding:18px 2px;text-align:left;overflow:hidden;
}
.fp-teaser p{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-teaser .t1{font-size:17px;font-weight:600;color:rgba(255,255,255,.92)}
.fp-teaser .t2{font-size:17px;font-weight:500;color:rgba(255,255,255,.38)}
.fp-teaser:active .t1{opacity:.7}

.fp-prog{padding-top:8px;flex:0 0 auto}
.fp-prog .bar{
  position:relative;height:2px;border-radius:1px;
  background:rgba(255,255,255,.22);cursor:pointer;touch-action:none;
}
.fp-prog .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:1px;background:var(--t1)}
.fp-prog .bar .knob{
  position:absolute;top:50%;width:12px;height:12px;border-radius:999px;background:var(--t1);
  transform:translate(-50%,-50%);opacity:0;transition:opacity .15s ease;
}
.fp-prog .bar:hover .knob,.fp-prog .bar.is-drag .knob{opacity:1}
.fp-prog .times{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--t2)}
.fp-prog{position:relative;z-index:6}

.fp-ctrl{
  position:relative;z-index:6;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 6px 6px;flex:0 0 auto;
}
.fp-ctrl .cbtn{width:48px;height:48px;border-radius:999px;display:grid;place-items:center;color:var(--t1)}
.fp-ctrl .cbtn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fp-ctrl .cbtn.sm svg{width:22px;height:22px}
.fp-ctrl .cbtn.on{color:var(--accent)}
.fp-ctrl .big{
  width:64px;height:64px;border-radius:999px;display:grid;place-items:center;
  background:var(--t1);color:#0b0b0b;
}
.fp-ctrl .big svg{width:28px;height:28px;fill:currentColor;stroke:none}

.fp-foot{
  position:relative;z-index:6;
  display:flex;align-items:center;justify-content:space-between;
  padding:6px var(--pad-page) calc(16px + env(safe-area-inset-bottom));
  flex:0 0 auto;
  /* 背景遮罩交给 .scrim，这里不再叠渐变（避免出现横向色带） */
}
.fp-foot .fbtn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--t2)}
.fp-foot .fbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 歌词视图 */
.lyr{
  position:absolute;left:0;right:0;top:0;bottom:150px;z-index:3;
  padding:0 28px;
  overflow:hidden;
  opacity:0;pointer-events:none;
  transition:opacity .18s ease;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 14%,#000 74%,transparent 96%);
          mask-image:linear-gradient(180deg,transparent,#000 14%,#000 74%,transparent 96%);
}
.full.is-lyric .lyr{opacity:1;pointer-events:auto}
.full.is-lyric .fp-art{opacity:0}
.full.is-lyric .fp-meta{opacity:0;pointer-events:none}
.full.is-lyric .fp-teaser{opacity:0;pointer-events:none}
.fp-teaser{transition:opacity .18s ease}
.lyr .inner{padding:34vh 0 34vh;transition:transform .5s cubic-bezier(.22,.61,.36,1)}
.lyr p{
  margin:0 0 22px;                /* [AM] 块间距 28–40，汉字取 22 */
  font-size:22px;line-height:1.35;font-weight:600;
  color:rgba(255,255,255,.45);
  transition:color .25s ease,transform .25s ease;
  transform-origin:left center;
}
.lyr p.on{color:#fff;transform:scale(1.02)}
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <button class="chip-icon" aria-label="我的设备">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M6.5 18a4 4 0 01-.4-7.98A5.5 5.5 0 0117 9.6a3.7 3.7 0 01.5 7.36"/><path d="M12 12v7M9.5 16.5L12 19l2.5-2.5"/></svg>
    </button>
    <div class="chips" id="chips">
      <button class="chip is-active">全部</button>
      <button class="chip">音乐</button>
      <button class="chip">播客</button>
      <button class="chip">有声书</button>
    </div>
  </div>

  <div class="quick">
    <button class="quick-card" data-open>
      <span class="qc-art" style="background:linear-gradient(150deg,#7b5cff,#3a2bd8 60%,#1b1660)">♥</span>
      <span class="qc-t">已点赞的歌曲</span>
    </button>
    <button class="quick-card" data-open>
      <span class="qc-art" style="background:linear-gradient(150deg,#e8c9a0,#b4735a 55%,#5c2f27)"></span>
      <span class="qc-t">rosie</span>
    </button>
  </div>

  <h2 class="sec-title">今日推荐</h2>
  <div class="row" id="row1"></div>

  <h2 class="sec-title">根据你的喜好推荐</h2>
  <div class="row" id="row2"></div>

  <h2 class="sec-title">最近播放</h2>
  <div class="list" id="recent"></div>
</div>

<div class="dock">
  <nav class="tabbar">
    <button class="tab is-active">
      <svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5"/><path d="M6 10v9h12v-9"/></svg>
      <span>主页</span>
    </button>
    <button class="tab">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <span>搜索</span>
    </button>
    <button class="tab">
      <svg viewBox="0 0 24 24"><path d="M5 5v14M10 5v14"/><path d="M15 6v12"/><path d="M19 7.5v9"/></svg>
      <span>音乐库</span>
    </button>
    <button class="tab">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg>
      <span>Premium</span>
    </button>
    <button class="tab">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>创建</span>
    </button>
  </nav>

  <button class="mini" id="mini" data-open>
    <span class="m-art" id="miniArt"></span>
    <span class="m-meta">
      <span class="m-title" id="miniTitle">—</span>
      <span class="m-sub" id="miniSub">—</span>
    </span>
    <span class="m-actions">
      <span class="mbtn" id="miniDev" role="button" aria-label="播放设备">
        <svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0116 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.6"/><rect x="17" y="14" width="4" height="6" rx="1.6"/></svg>
      </span>
      <span class="mbtn play" id="miniPlay" role="button" aria-label="播放">
        <svg viewBox="0 0 24 24"><path d="M8 5.5l11 6.5-11 6.5z"/></svg>
      </span>
    </span>
    <span class="m-prog"><i id="miniProg"></i></span>
  </button>
</div>

<!-- 全屏播放 -->
<section class="full" id="full">
  <div class="wash" id="wash"></div>
  <div class="scrim"></div>

  <div class="fp-head">
    <button class="hbtn" id="fpClose" aria-label="收起">
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <span class="hlabel" id="fpLabel">正在播放</span>
    <button class="hbtn" id="fpMore" aria-label="更多">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>

  <div class="fp-body">
    <div class="fp-art" id="fpArt"></div>
    <div class="fp-meta">
      <h1 id="fpTitle">—</h1>
      <p id="fpArtist">—</p>
    </div>

    <button class="fp-teaser" id="fpTeaser">
      <p class="t1" id="tease1"></p>
      <p class="t2" id="tease2"></p>
    </button>

    <div class="fp-prog">
      <div class="bar" id="fpBar">
        <span class="fill" id="fpFill"></span>
        <span class="knob" id="fpKnob"></span>
      </div>
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    </div>

    <div class="fp-ctrl">
      <button class="cbtn sm" id="btnShuffle" aria-label="随机">
        <svg viewBox="0 0 24 24"><path d="M4 7h3.5l9 10H20"/><path d="M17 4l3 3-3 3"/><path d="M4 17h3.5l2.2-2.4"/><path d="M14.2 9.4L16.5 7H20"/><path d="M17 14l3 3-3 3"/></svg>
      </button>
      <button class="cbtn" id="btnPrev" aria-label="上一首">
        <svg viewBox="0 0 24 24"><path d="M18 6v12L9 12z"/><path d="M6 6v12"/></svg>
      </button>
      <button class="big" id="btnPlay" aria-label="播放">
        <svg viewBox="0 0 24 24" id="icoPlay"><path d="M8 5.5l11 6.5-11 6.5z"/></svg>
      </button>
      <button class="cbtn" id="btnNext" aria-label="下一首">
        <svg viewBox="0 0 24 24"><path d="M6 6v12l9-6z"/><path d="M18 6v12"/></svg>
      </button>
      <button class="cbtn sm" id="btnRepeat" aria-label="循环">
        <svg viewBox="0 0 24 24"><path d="M7 7h9a3 3 0 013 3v2"/><path d="M16 4l3 3-3 3"/><path d="M17 17H8a3 3 0 01-3-3v-2"/><path d="M8 20l-3-3 3-3"/></svg>
      </button>
    </div>

    <div class="fp-foot">
      <button class="fbtn" id="btnLike" aria-label="喜欢">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-7-9a4 4 0 017-2.6A4 4 0 0119 11c0 4.4-7 9-7 9z"/></svg>
      </button>
      <button class="fbtn" id="btnLyric" aria-label="歌词">
        <svg viewBox="0 0 24 24"><path d="M4 7h9M4 12h9M4 17h6"/><path d="M18 6v9.2"/><circle cx="16.3" cy="16.2" r="1.7"/></svg>
      </button>
      <button class="fbtn" id="btnQueue" aria-label="队列">
        <svg viewBox="0 0 24 24"><path d="M4 6h11M4 11h11M4 16h11"/><path d="M17.5 6.5l4 3-4 3z"/></svg>
      </button>
    </div>
  </div>

  <div class="lyr" id="lyr"><div class="inner" id="lyrInner"></div></div>
</section>

<script src="app.js"></script>
</body>
</html>
